<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Расписание П-51БС</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#000;--card:#1c1c1e;--card2:#2c2c2e;--fg:#fff;--hint:#8e8e93;--sep:rgba(84,84,88,.55);
--blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--purple:#bf5af2;--gray:#98989d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#000}
body{margin:0;padding:calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));color:var(--fg);
font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.large{font-size:34px;font-weight:700;letter-spacing:-.4px;margin:4px 4px 2px}
.sub{color:var(--hint);font-size:15px;margin:0 4px 16px}
.card{background:var(--card);border-radius:22px;padding:20px;margin-bottom:14px}
.hint{color:var(--hint);font-size:14px}
.cap{color:var(--hint);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.ringwrap{position:relative;width:176px;height:176px;margin:10px auto 6px}
.ringwrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ringwrap .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.big{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-1px;line-height:1.05}
.title{font-size:22px;font-weight:700;letter-spacing:-.3px;text-align:center;margin:10px 0 8px;line-height:1.2}
.center{text-align:center}
.pill{display:inline-block;padding:3px 11px;border-radius:99px;font-size:13px;font-weight:600}
.next{background:var(--card2);border-radius:14px;padding:12px 14px;margin-top:16px;font-size:15px}
.nav{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;gap:8px}
.nav b{font-size:17px;text-align:center;flex:1}
.nav button{border:0;border-radius:50%;width:38px;height:38px;font-size:20px;background:var(--card);color:var(--blue);padding:0}
.nav button:active{background:var(--card2)}
#today{display:none;margin:0 auto 10px;border:0;border-radius:99px;background:var(--card);color:var(--blue);font-size:15px;padding:7px 16px}
.list{background:var(--card);border-radius:22px;padding:4px 0;overflow:hidden}
.row{display:flex;gap:12px;padding:13px 16px;position:relative;align-items:flex-start}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.row.now{background:var(--card2)}.row.done{opacity:.4}
.tm{min-width:50px;font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;line-height:1.25}
.tm span{display:block;color:var(--hint);font-weight:400;font-size:14px}
.dot{width:4px;align-self:stretch;border-radius:2px;flex:none}
.sb{font-size:16px;font-weight:600;line-height:1.25}
.meta{margin-top:5px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;color:var(--hint);font-size:14px}
.live{color:var(--green);font-size:12px;font-weight:700;margin-left:6px}
.empty{padding:18px 16px;color:var(--hint);text-align:center}
</style>
</head>
<body>
<div class="large" id="h1">Расписание</div>
<div class="sub" id="h2">П-51БС · сессия 9–28 ноября</div>
<div id="hero"></div>
<div class="nav"><button id="prev">‹</button><b id="dlabel"></b><button id="next">›</button></div>
<div style="text-align:center"><button id="today">Сегодня</button></div>
<div class="list" id="list"></div>
<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setBackgroundColor('#000000'); tg.setHeaderColor('#000000'); } catch (e) {} }
const DAYS = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MON = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
let S, view = null, TZ = 'Asia/Yekaterinburg';

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const toMin = t => { const [h, m] = t.split(':').map(Number); return h * 60 + m; };
const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
function now() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA', {timeZone: TZ, hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit'}).formatToParts(new Date()).map(x => [x.type, x.value]));
  return {date: `${p.year}-${p.month}-${p.day}`, sec: (+p.hour) * 3600 + (+p.minute) * 60 + (+p.second)};
}
const dow = d => new Date(d + 'T00:00:00Z').getUTCDay();
const addDays = (d, n) => new Date(new Date(d + 'T00:00:00Z').getTime() + n * 864e5).toISOString().slice(0, 10);
const human = d => { const x = new Date(d + 'T00:00:00Z'); return `${x.getUTCDate()} ${MON[x.getUTCMonth()]}, ${DAYS[x.getUTCDay()]}`; };
const fmt = s => { s = Math.max(0, s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), c = s % 60;
  return (h ? h + ':' : '') + String(m).padStart(h ? 2 : 1, '0') + ':' + String(c).padStart(2, '0'); };

function dayItems(date) {
  const bells = S.bells[dow(date) === 6 ? 'saturday' : 'weekday'];
  return S.lessons.filter(l => l.date === date).map(l => {
    if (l.allday) return {...l, allday: true};
    const b = bells[l.pair - 1] || [];
    return {...l, s: toMin(l.start || b[0]), e: toMin(l.end || b[1])};
  }).sort((a, b) => (a.s ?? -1) - (b.s ?? -1));
}
const isExam = l => /ЗАЧЕТ|ЭКЗАМЕН|защита/.test(l.type);
const color = l => isExam(l) ? 'var(--orange)' : /лаб/.test(l.type) ? 'var(--purple)' : /практика/.test(l.type) ? 'var(--green)' : /лекция/.test(l.type) ? 'var(--blue)' : 'var(--gray)';
const badge = l => `<span class="pill" style="color:${color(l)};background:color-mix(in srgb, ${color(l)} 18%, transparent)">${esc(l.type)}</span>`;
const place = l => l.room ? `ауд. ${esc(l.room)}` : '';

function ring(frac, col, big, small) {
  const C = 2 * Math.PI * 52, off = C * (1 - Math.min(1, Math.max(0, frac)));
  return `<div class="ringwrap"><svg viewBox="0 0 120 120"><circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="9"/>
    <circle cx="60" cy="60" r="52" fill="none" stroke="${col}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>
    <div class="in"><div class="big">${big}</div><div class="hint">${small}</div></div></div>`;
}

function hero(n) {
  const items = dayItems(n.date).filter(l => !l.allday), cur = n.sec;
  const cl = items.find(l => cur >= l.s * 60 && cur < l.e * 60);
  const nx = items.find(l => l.s * 60 > cur);
  if (cl) {
    const total = (cl.e - cl.s) * 60, left = cl.e * 60 - cur, gap = nx ? nx.s - cl.e : 0;
    const nextTxt = nx ? `<b>Дальше:</b> ${nx.pair ? 'пара ' + nx.pair + ' · ' : ''}${esc(nx.subject)}, ${hhmm(nx.s)}` + (gap <= 0 ? '' : gap >= 40 ? `<div class="hint">Обед ${gap} мин</div>` : `<div class="hint">Перерыв ${gap} мин</div>`) : 'Это последняя пара на сегодня';
    return `<div class="card"><div class="cap center">${cl.pair ? 'Пара ' + cl.pair : 'Занятие'} · ${hhmm(cl.s)}–${hhmm(cl.e)}</div>
      ${ring((total - left) / total, 'var(--green)', fmt(left), 'до конца')}
      <div class="title">${esc(cl.subject)}</div>
      <div class="center">${badge(cl)} <span class="hint">&nbsp;${place(cl)}</span></div>
      ${cl.teacher ? `<div class="hint center" style="margin-top:8px">${esc(cl.teacher)}</div>` : ''}
      <div class="next">${nextTxt}</div></div>`;
  }
  if (nx) {
    const prev = [...items].reverse().find(l => l.e * 60 <= cur);
    const gap = prev ? nx.s - prev.e : null, frac = prev ? (cur - prev.e * 60) / (gap * 60) : 0;
    const kind = gap >= 40 ? 'Обед' : prev ? 'Перерыв' : 'До начала';
    return `<div class="card"><div class="cap center">${kind}${gap ? ' · ' + gap + ' мин' : ''}</div>
      ${ring(frac, 'var(--blue)', fmt(nx.s * 60 - cur), 'до начала')}
      <div class="cap center" style="margin-top:6px">Следом${nx.pair ? ' · пара ' + nx.pair : ''} · ${hhmm(nx.s)}–${hhmm(nx.e)}</div>
      <div class="title">${esc(nx.subject)}</div>
      <div class="center">${badge(nx)} <span class="hint">&nbsp;${place(nx)}</span></div></div>`;
  }
  const allday = dayItems(n.date).find(l => l.allday);
  if (allday) return `<div class="card center"><div class="title">${esc(allday.subject)}</div><div class="hint">Занятий по расписанию нет</div></div>`;
  if (items.length) return `<div class="card center"><div class="title">На сегодня всё 🎉</div><div class="hint">Пары закончились</div></div>`;
  return null;
}
function upcoming(n) {
  const next = S.lessons.map(l => l.date).filter(d => d > n.date).sort()[0];
  if (!next) return `<div class="card center"><div class="title">Расписание закончилось</div></div>`;
  const first = dayItems(next).find(l => !l.allday), days = Math.round((new Date(next) - new Date(n.date)) / 864e5);
  return `<div class="card center"><div class="cap">Сегодня занятий нет</div>
    <div class="title">Ближайший день: ${human(next)}</div>
    <div class="hint">через ${days} дн.${first ? ` · первое занятие в ${hhmm(first.s)}` : ''}</div></div>`;
}

function render() {
  const n = now(); if (!view) view = n.date;
  document.getElementById('hero').innerHTML = hero(n) || upcoming(n);
  document.getElementById('dlabel').textContent = (view === n.date ? 'Сегодня · ' : '') + human(view);
  document.getElementById('today').style.display = view === n.date ? 'none' : 'inline-block';
  const items = dayItems(view);
  document.getElementById('list').innerHTML = items.length ? items.map(l => {
    const live = view === n.date && !l.allday && n.sec >= l.s * 60 && n.sec < l.e * 60;
    const cls = view === n.date && !l.allday ? (n.sec >= l.e * 60 ? 'done' : live ? 'now' : '') : '';
    return `<div class="row ${cls}"><div class="dot" style="background:${color(l)}"></div>
      <div class="tm">${l.allday ? '<span>весь день</span>' : hhmm(l.s) + '<span>' + hhmm(l.e) + '</span>'}</div>
      <div style="flex:1"><div class="sb">${l.pair ? l.pair + '. ' : ''}${esc(l.subject)}${live ? '<span class="live">СЕЙЧАС</span>' : ''}</div>
      <div class="meta">${badge(l)} ${place(l)}${l.teacher ? '<span>' + esc(l.teacher) + '</span>' : ''}</div></div></div>`;
  }).join('') : '<div class="empty">В этот день занятий нет</div>';
}
document.getElementById('prev').onclick = () => { view = addDays(view, -1); render(); };
document.getElementById('next').onclick = () => { view = addDays(view, 1); render(); };
document.getElementById('today').onclick = () => { view = now().date; render(); };
fetch('schedule.json').then(r => r.json()).then(j => { S = j; TZ = j.timezone; render(); setInterval(render, 1000); })
  .catch(() => document.getElementById('hero').innerHTML = '<div class="card">Не удалось загрузить schedule.json</div>');
</script>
</body>
</html>
